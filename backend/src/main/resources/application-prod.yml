spring:
  data:
    redis:
      # Set REDIS_URL on Railway to the Redis plugin's ${{Redis.REDIS_URL}}
      url: ${REDIS_URL:redis://localhost:6379}
  datasource:
    # DATABASE_URL must be a JDBC url. On Railway set it to:
    #   jdbc:postgresql://${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/${{Postgres.PGDATABASE}}
    url: ${DBURL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      # Hibernate owns the schema — creates the questions table from the entity if missing (idempotent).
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    com.interview.backend: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  migration:
    json-path: ${MIGRATION_JSON_PATH:../frontend/public/questions.json}
    batch-size: 100