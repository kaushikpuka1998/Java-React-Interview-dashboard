spring:
  data:
    redis:
      # Set REDIS_URL on Railway to the Redis plugin's ${{Redis.REDIS_URL}}
      url: ${REDIS_URL:redis://localhost:6379}
  datasource:
    # DATABASE_URL must be a JDBC url. On Railway set it to:
    #   jdbc:postgresql://${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/${{Postgres.PGDATABASE}}
    url: ${DBURL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      # Hibernate owns the schema — creates the questions table from the entity if missing (idempotent).
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    com.interview.backend: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

app:
  admin:
    # Comma-separated emails that get ROLE_ADMIN (can publish questions). Override with ADMIN_EMAILS.
    emails: ${ADMIN_EMAILS:kaushikghosh199832@gmail.com}
  jwt:
    # Override in prod via APP_JWT_SECRET (>= 32 chars). Dev fallback is fine for local only.
    secret: ${APP_JWT_SECRET:dev-only-change-me-interview-jwt-secret-key}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  migration:
    json-path: ${MIGRATION_JSON_PATH:../frontend/public/questions.json}
    batch-size: 100
  s3:
    # LocalStack for local dev; override all of these in prod with real AWS values.
    endpoint: ${AWS_S3_ENDPOINT}
    public-url: ${AWS_S3_PUBLIC_URL}
    region: ${AWS_REGION}
    bucket: ${AWS_S3_BUCKET}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}