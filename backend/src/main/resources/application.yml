server:
  port: ${PORT:8082}
  servlet:
    context-path: /api

spring:
  application:
    name: interview-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      # Railway Redis provides REDIS_URL (redis://default:pass@host:port). Falls back to localhost.
      url: ${REDIS_URL:redis://localhost:6379}
  datasource:
    # DATABASE_URL must be a JDBC url (jdbc:postgresql://host:port/db). Falls back to localhost for local dev.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interviewdb}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:1998}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      # Hibernate owns the schema — creates the questions table from the entity if missing (idempotent).
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
  flyway:
    enabled: false

logging:
  level:
    com.interview.backend: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  # This backend's own public origin (no trailing slash). Uploaded images are served
  # back via {public-base-url}/api/images/file/**, so the S3 bucket can stay private.
  # On Railway set APP_PUBLIC_BASE_URL to the backend's public URL (https://...up.railway.app).
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8082}
  s3:
    # LocalStack for local dev; override with real AWS/Railway values in prod.
#    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
#    region: ${AWS_REGION:us-east-1}
#    bucket: ${AWS_S3_BUCKET:blog-images}
#    access-key: ${AWS_ACCESS_KEY_ID:test}
#    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
      region: ${AWS_REGION:us-east-1}
      bucket: ${AWS_S3_BUCKET:blog-images}
      access-key: ${AWS_ACCESS_KEY_ID:test}
      secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  admin:
    # Comma-separated emails that get ROLE_ADMIN (can publish questions). Override with ADMIN_EMAILS.
    emails: ${ADMIN_EMAILS:kaushikghosh199832@gmail.com}
  jwt:
    # Override in prod via APP_JWT_SECRET (>= 32 chars). Dev fallback is fine for local only.
    secret: ${APP_JWT_SECRET:dev-only-change-me-interview-jwt-secret-key}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  migration:
    json-path: ${MIGRATION_JSON_PATH:../frontend/public/questions.json}
    batch-size: 100