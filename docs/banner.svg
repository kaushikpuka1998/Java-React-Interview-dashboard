<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Interview Reader">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- soft orbs -->
  <circle cx="1050" cy="70" r="180" fill="#6366f1" opacity="0.18"/>
  <circle cx="120" cy="320" r="160" fill="#ec4899" opacity="0.12"/>

  <!-- logo tile -->
  <rect x="80" y="120" width="92" height="92" rx="22" fill="url(#logo)"/>
  <text x="126" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle">IR</text>

  <!-- title -->
  <text x="200" y="168" font-family="'Segoe UI',Arial,sans-serif" font-size="58" font-weight="800" fill="#f8fafc">Interview Reader</text>
  <text x="202" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="24" fill="#94a3b8">A fast, searchable reader for Java, React, Node &amp; SQL interview questions</text>

  <!-- tech pills -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="600">
    <rect x="200" y="248" width="130" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
    <text x="265" y="274" fill="#93c5fd" text-anchor="middle">React</text>
    <rect x="342" y="248" width="160" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
    <text x="422" y="274" fill="#fdba74" text-anchor="middle">Spring Boot</text>
    <rect x="514" y="248" width="150" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
    <text x="589" y="274" fill="#c4b5fd" text-anchor="middle">PostgreSQL</text>
    <rect x="676" y="248" width="120" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
    <text x="736" y="274" fill="#a5b4fc" text-anchor="middle">Railway</text>
  </g>

  <!-- accent underline -->
  <rect x="202" y="228" width="360" height="4" rx="2" fill="url(#accent)"/>
</svg>
